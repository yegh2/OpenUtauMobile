name: Build Unsigned IPA (OpenUtauMobile)

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Downgrade Avalonia.iOS
        run: |
          sed -i '' 's|<PackageReference Include="Avalonia.iOS" Version="12.1.0" />|<PackageReference Include="Avalonia.iOS" Version="11.0.10" />|g' OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj

      - name: Restore dependencies (iOS only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj -p:TargetFramework=net9.0-ios

      - name: Build .app without signing
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:EnableCodeSigning=false \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net9.0-ios \
            -o ./output

      - name: Package .app into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R ./output/OpenUtauMobile.iOS.app Payload/
          zip -r OpenUtauMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned-ipa
          path: OpenUtauMobile-unsigned.ipa
