name: Build Unsigned IPA (OpenUtauMobile)

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev          # 使用 dev 分支（如需 master 可改为 master）

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # ---------- 关键步骤：降级 Avalonia.iOS 到兼容版本 ----------
      - name: Downgrade Avalonia.iOS to 11.0.10
        run: |
          echo "=== Before modification ==="
          grep -n "Avalonia.iOS" OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj || echo "Pattern not found"

          # 使用 perl 进行稳健的文本替换（macOS 默认自带 perl）
          perl -pi -e 's/<PackageReference Include="Avalonia\.iOS" Version="[^"]*" \/>/<PackageReference Include="Avalonia.iOS" Version="11.0.10" \/>/g' OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj

          echo "=== After modification ==="
          grep -n "Avalonia.iOS" OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj || echo "Pattern not found"
      # -----------------------------------------------------------

      - name: Restore dependencies (iOS only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj -p:TargetFramework=net9.0-ios

      - name: Build .app without signing
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:EnableCodeSigning=false \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net9.0-ios \
            -o ./output

      - name: Package .app into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R ./output/OpenUtauMobile.iOS.app Payload/
          zip -r OpenUtauMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned-ipa
          path: OpenUtauMobile-unsigned.ipa
