name: Build Unsigned IPA (OpenUtauMobile)

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup .NET 10 (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Update workload manifests
        run: dotnet workload update

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # Unify target frameworks to net10.0-ios
      - name: Unify target frameworks
        run: |
          projects=(
            "OpenUtauMobile/OpenUtauMobile.csproj"
            "OpenUtau.Core/OpenUtau.Core.csproj"
            "OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj"
            "OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj"
          )
          for proj in "${projects[@]}"; do
            if [ -f "$proj" ]; then
              echo "Modifying $proj"
              sed -i '' -E 's|<TargetFramework>[^<]*</TargetFramework>|<TargetFramework>net10.0-ios</TargetFramework>|g' "$proj"
              sed -i '' -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-ios</TargetFramework>|g' "$proj"
            else
              echo "Warning: $proj not found, skipping"
            fi
          done

      - name: Restore dependencies (iOS only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj -p:TargetFramework=net10.0-ios

      # ONNX Runtime iOS targets link onnxruntime.xcframework.zip as a NativeReference.
      # The xcframework also contains a Mac Catalyst slice whose binary links AppKit,
      # so the iOS linker fails with "framework 'AppKit' not found". Patch the cached
      # zip to keep only the ios-arm64 slice (also fixes _RegisterCustomOps resolution
      # by keeping the static library in the link).
      - name: Patch OnnxRuntime xcframework (drop maccatalyst slice)
        run: |
          set -e
          ZIP=$(find /Users/runner/.nuget/packages/microsoft.ml.onnxruntime -name "onnxruntime.xcframework.zip" | head -1)
          echo "Found: $ZIP"
          DIR=$(dirname "$ZIP")
          mkdir -p /tmp/xcf
          cd /tmp/xcf
          unzip -q "$ZIP"
          rm -rf onnxruntime.xcframework/ios-arm64_x86_64-maccatalyst
          rm -rf onnxruntime.xcframework/ios-arm64_x86_64-simulator
          python3 -c "import plistlib; p=plistlib.load(open('onnxruntime.xcframework/Info.plist','rb')); p['AvailableLibraries']=[l for l in p['AvailableLibraries'] if l.get('LibraryIdentifier')=='ios-arm64']; plistlib.dump(p, open('onnxruntime.xcframework/Info.plist','wb')); print([l['LibraryIdentifier'] for l in p['AvailableLibraries']])"
          zip -rq "$ZIP" onnxruntime.xcframework
          echo "Patched xcframework zip"

      # Avalonia 12.x ships a correct default for AvaloniaBuildTasksLocation
      # (buildTransitive/Avalonia.props points to tools/netstandard2.0/Avalonia.Build.Tasks.dll).
      # Overriding it with a directory path breaks task loading, so do not pass it.
      - name: Build .app without signing
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:EnableCodeSigning=false \
            -p:RuntimeIdentifier=ios-arm64 \
            -o ./output

      - name: Package .app into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R ./output/OpenUtauMobile.iOS.app Payload/
          zip -r OpenUtauMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned-ipa
          path: OpenUtauMobile-unsigned.ipa
