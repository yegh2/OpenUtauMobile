name: Build Unsigned IPA (OpenUtauMobile)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore dependencies
        run: dotnet restore -p:TargetFramework=net9.0-ios

      # 🔧 核心：构建时不签名（EnableCodeSigning=false），直接生成 .app 包
      - name: Build .app without signing
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:EnableCodeSigning=false \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net9.0-ios \
            -o ./output

      # 📦 手动打包成 .ipa（将 .app 放入 Payload 目录压缩）
      - name: Package .app into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R ./output/OpenUtauMobile.app Payload/
          zip -r OpenUtauMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned-ipa
          path: OpenUtauMobile-unsigned.ipa
