name: Build Unsigned IPA (OpenUtauMobile)

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup .NET 10 (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Update workload manifests
        run: dotnet workload update

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # 缁熶竴鐩爣妗嗘灦涓?net10.0-ios
      - name: Unify target frameworks
        run: |
          projects=(
            "OpenUtauMobile/OpenUtauMobile.csproj"
            "OpenUtau.Core/OpenUtau.Core.csproj"
            "OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj"
            "OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj"
          )
          for proj in "${projects[@]}"; do
            if [ -f "$proj" ]; then
              echo "Modifying $proj"
              sed -i '' -E 's|<TargetFramework>[^<]*</TargetFramework>|<TargetFramework>net10.0-ios</TargetFramework>|g' "$proj"
              sed -i '' -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-ios</TargetFramework>|g' "$proj"
            else
              echo "Warning: $proj not found, skipping"
            fi
          done

      - name: Restore dependencies (iOS only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj -p:TargetFramework=net10.0-ios

      # Avalonia 12.x 鍖呰嚜甯?AvaloniaBuildTasksLocation 榛樿鍊?      # 锛坆uildTransitive/Avalonia.props 鎸囧悜 tools/netstandard2.0/Avalonia.Build.Tasks.dll锛夛紝
      # 鎵嬪姩瑕嗙洊鍙嶈€屼細鐮村潖浠诲姟鍔犺浇锛屾晠涓嶅啀浼犺鍙傛暟
      - name: Build .app without signing
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:EnableCodeSigning=false \
            -p:RuntimeIdentifier=ios-arm64 \
            -o ./output

      - name: Package .app into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R ./output/OpenUtauMobile.iOS.app Payload/
          zip -r OpenUtauMobile-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned-ipa
          path: OpenUtauMobile-unsigned.ipa
